version: 1
profile: "baseline"
seed: 42

logging:
  default_level: "info"
  signposts: true
  file_sync: false
  destinations:
    - type: "stdout"
    - type: "file"
      path: "Logs/baseline.log"
  levels_override:
    capsule.encode: "debug"
    router.spike: "trace"
    ui.pipeline: "info"
    trainer.loop: "info"
    trainer.eval: "info"
  timestamp_kind: "relative"

process_registry:
  capsule.encode: "capsule.encode"
  capsule.base_b: "capsule.base_b"
  capsule.to_energies: "capsule.to_energies"
  capsule.from_energies: "capsule.from_energies"
  router.step: "router.step"
  router.spike: "router.spike"
  router.output: "router.output"
  trainer.loop: "trainer.loop"
  trainer.eval: "trainer.eval"
  ui.pipeline: "ui.pipeline"
  ui.graph: "ui.graph"
  cli.main: "cli.main"

paths:
  logs_dir: "Logs"
  checkpoints_dir: "Artifacts/Checkpoints"
  snapshots_dir: "Artifacts/Snapshots"
  pipeline_snapshot: "Artifacts/pipeline_snapshot.json"

capsule:
  enabled: true
  max_input_bytes: 4096
  block_size: 4128
  base: 256
  alphabet: "ĀāĂăĄąĆćĈĉĊċČčĎďĐđĒēĔĕĖėĘęĚěĜĝĞğĠġĢģĤĥĦħĨĩĪīĬĭĮįİıĲĳĴĵĶķĸĹĺĻļĽľĿŀŁłŃńŅņŇňŉŊŋŌōŎŏŐőŒœŔŕŖŗŘřŚśŜŝŞşŠšŢţŤťŦŧŨũŪūŬŭŮůŰűŲųŴŵŶŷŸŹźŻżŽžſƀƁƂƃƄƅƆƇƈƉƊƋƌƍƎƏƐƑƒƓƔƕƖƗƘƙƚƛƜƝƞƟƠơƢƣƤƥƦƧƨƩƪƫƬƭƮƯưƱƲƳƴƵƶƷƸƹƺƻƼƽƾƿǀǁǂǃǄǅǆǇǈǉǊǋǌǍǎǏǐǑǒǓǔǕǖǗǘǙǚǛǜǝǞǟǠǡǢǣǤǥǦǧǨǩǪǫǬǭǮǯǰǱǲǳǴǵǶǷǸǹǺǻǼǽǾǿ"
  prp: "feistel"
  feistel_rounds: 10
  key_hex: "000102030405060708090a0b0c0d0e0f"
  normalization: "e_over_bplus1"
  pipeline_example_text: "Hello, Energetic Router!"
  crc: "crc32"
  gpu_batch: 512

router:
  snn:
    parameter_count: 512
  backend: "flow"
  flow:
    T: 28
    radius: 10.0
    seed_layout: "ring"
    seed_radius: 1.0
    lif:
      decay: 0.92
      threshold: 0.8
      reset_value: 0.0
      surrogate: "fast_sigmoid"
    dynamics:
      radial_bias: 0.22
      spike_kick: 0.8
      # Reduce gain coupling into dynamics; keep gains primarily for shaping output histogram.
      gain_spike_kick_scale: 0.0
      noise_std_pos: 0.01
      noise_std_dir: 0.05
      max_speed: 1.0
      energy_alpha: 1.0
      # Wide but safe: avoid premature death, but still keep a floor for stability.
      energy_floor: 1.0e-9
      # Wide but safe: keep bounded energy injection.
      energy_spike_gain: 1.0
      # Disable per-step energy bias from gains to avoid feedback explosions.
      energy_gain_bias: 0.0
      # Wide but safe ceiling.
      energy_cap: 8192.0
    interactions:
      enabled: false
      type: "none"
      strength: 0.0
    projection:
      shape: "circle"
      bins: 256
      bin_smoothing: 0.0
    learning:
      enabled: true
      epochs: 50
      steps_per_epoch: 12
      target_spike_rate: 0.15
      eval_every: 300
      log_silence: true
      log_every: 100
      log_every_ui: 300
      # FlowLearningLoop now uses summed histogram bins as prediction; output_signal is currently informational.
      output_signal: "completion_cpu"
      dataset:
        name: "logiqa"
        local_path: "Artifacts/Datasets/LogiQA/prepared/prepared_train.jsonl"
        valid_path: "Artifacts/Datasets/LogiQA/prepared/prepared_valid.jsonl"
        cache_mode: "prepared"
        train_limit: 0
        valid_limit: 0
        shuffle: true
        seed: 42
      negative:
        enabled: true
        weight: 0.4
        margin: 0.5
      lr:
        # Smaller gain LR: reduce oscillations; learning still happens via normalized histogram shape.
        gain: 0.005
        lif: 0.02
        dynamics: 0.003
      gain_error_power: 1.5
      gain_error_scale: 1.0
      weights:
        spike: 0.0
        boundary: 0.05
      bounds:
        theta: [0.5, 1.0]
        radial_bias: [0.0, 0.5]
        spike_kick: [0.0, 1.0]
        # Wide but safe; keeps gain influence bounded and near 1.
        gain: [0.25, 4.0]
      aggregator:
        sigma_r: 2.5
        sigma_e: 120.0
        alpha: 1.0
        beta: 1.0
        gamma: 0.5
        tau: 1.0
      targets:
        type: "capsule-digits"
        path: null
  energy_constraints:
    energy_base: 256

ui:
  enabled: true
  refresh_hz: 30
  headless_override: false
  show_pipeline: true
  show_graph: true
  pipeline_snapshot_path: "Artifacts/pipeline_snapshot.json"
  metrics_poll_ms: 200

histogram_language:
  enabled: true
  normalize_input: true
  normalize_output: true
  metrics: ["l1", "l2", "cosine"]
  retrieval:
    enabled: true
    top_k: 1
    corpus_path: "Artifacts/Corpora/histogram_corpus.jsonl"
